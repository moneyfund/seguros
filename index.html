<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001929" />
    <meta name="description" content="Asesoría y corretaje de seguros en Nicaragua. Conocé alternativas de vida, salud, vehículos, hogar y empresas, con ACOS a tu lado." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_NI" />
    <meta property="og:site_name" content="ACOS" />
    <meta property="og:title" content="ACOS · Aseguramos tu futuro" />
    <meta property="og:description" content="Tu familia. Tu patrimonio. Tu empresa. Asesoría de seguros en Nicaragua con información clara y acompañamiento." />
    <meta property="og:image" content="/acos-logo.png" />
    <meta property="og:image:alt" content="Logotipo oficial de ACOS" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ACOS · Aseguramos tu futuro" />
    <meta name="twitter:description" content="Asesoría y corretaje de seguros en Nicaragua. Seguros para tu familia, tu vehículo, tu hogar y tu empresa." />
    <meta name="twitter:image" content="/acos-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/acos-symbol.svg" />
    <link rel="apple-touch-icon" href="/brand/acos-symbol.png" />
    <title>ACOS | Correduría de Seguros · Aseguramos tu futuro</title>
    <link rel="stylesheet" href="/brand/loading.css" />
  </head>
  <body>
    <!-- A first-paint public transition; never shown on direct private routes. -->
    <div id="acos-public-loader" class="acos-loading-screen" hidden role="status" aria-label="Cargando ACOS">
      <div class="acos-loading-content">
        <div class="acos-loading-brand"><img src="/brand/acos-horizontal-negative.svg" alt="ACOS · Correduría de Seguros y Fianzas" width="1360" height="385" fetchpriority="high" /></div>
        <p class="acos-loading-slogan">Aseguramos <em>tu futuro.</em></p>
        <span class="acos-loading-context" id="acos-loading-context">CORREDURÍA DE SEGUROS Y FIANZAS</span>
        <div class="acos-loading-track" aria-hidden="true"><i></i></div>
        <span class="acos-loading-status" id="acos-loading-status">Cargando experiencia</span>
        <a class="acos-loading-retry" href="" onclick="location.reload();return false;">¿Tarda demasiado? Recargar</a>
      </div>
    </div>
    <script>
      (function () {
        var h = location.hash;
        var academy = /^#\/academy\/?$/.test(h);
        var publicPage = !h || h === '#' || /^#(?:\/inicio(?:\/.*)?|\/web(?:\/.*)?|inicio|servicios|filosofia|proceso|contacto)$/.test(h);
        if (!academy && !publicPage) return;
        var loader = document.getElementById('acos-public-loader');
        if (academy) {
          document.getElementById('acos-loading-context').textContent = 'ACOS ACADEMY';
          document.getElementById('acos-loading-status').textContent = 'Preparando tu aprendizaje';
          loader.setAttribute('aria-label', 'Cargando ACOS Academy');
        }
        loader.dataset.started = String(performance.now());
        loader.hidden = false;
        document.documentElement.classList.add('acos-loading-active');
      })();
    </script>
    <div id="root"></div>
    <noscript>ACOS · Asesoría y corretaje de seguros en Nicaragua. Activá JavaScript para explorar las soluciones y acceder a la plataforma empresarial.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
