name: Public website browser checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'scripts/public-site-qa.mjs'
      - 'scripts/brand-qa.mjs'
      - 'scripts/build-brand-fixture.mjs'
      - 'tests/brand/**'
      - '.github/workflows/public-site-qa.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build the application
        run: npm install --no-audit --no-fund && npm run typecheck && npm run build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/acos-qa" --no-audit --no-fund playwright@1.62.1 axe-core@4.14.0
          "$RUNNER_TEMP/acos-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify public flows, responsive layouts and access boundaries
        run: ACOS_QA_MODULES="$RUNNER_TEMP/acos-qa/node_modules" node scripts/public-site-qa.mjs
      - name: Verify administration and agent visual fixtures
        run: |
          node scripts/build-brand-fixture.mjs
          ACOS_QA_MODULES="$RUNNER_TEMP/acos-qa/node_modules" node scripts/brand-qa.mjs
      - name: Save visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-website-review
          path: |
            public-site-qa/
            brand-qa/
          retention-days: 7
          if-no-files-found: ignore
