name: ACOS production build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test issuance workflow invariants
        run: node --experimental-strip-types --test tests/issuance-workflow.test.mjs
      - name: Typecheck and build
        run: npm run typecheck && npm run build
