# ACOS Enterprise · SQL Connect relational schema v1
#
# Production target: Firebase SQL Connect -> Cloud SQL for PostgreSQL.
# No sensitive identity number or file contents are stored here:
# private documents live in Firebase Storage; this schema stores metadata.
# All monetary amounts are in minor currency units (cents), not floating point.
# All tenant-owned records reference Company, enabling reuse by other brokerages.
# Any browser-facing operation must have server-side authorization in the connector.

type Company @table {
  slug: String! @unique
  legalName: String!
  publicName: String!
  customerPortalEnabled: Boolean! @default(value: false)
  countryCode: String! @default(value: "NI")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
}

type AppUser @table(key: "firebaseUid") {
  firebaseUid: String!
  email: String! @unique
  displayName: String!
  phone: String
  photoStoragePath: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Department @table @unique(fields: ["company", "code"]) {
  company: Company!
  code: String!
  name: String!
  active: Boolean! @default(value: true)
}

type CompanyRole @table @unique(fields: ["company", "key"]) {
  company: Company!
  key: String!
  label: String!
  active: Boolean! @default(value: true)
}

type PortalView @table(key: "key") {
  key: String!
  label: String!
  description: String
}

type RoleView @table(key: ["role", "view"]) {
  role: CompanyRole!
  view: PortalView!
}

type CompanyMember @table @unique(fields: ["company", "user"]) {
  company: Company!
  user: AppUser!
  department: Department!
  employeeCode: String! @unique
  active: Boolean! @default(value: true)
  joinedAt: Timestamp! @default(expr: "request.time")
  approvedBy: AppUser
}

type MemberRole @table(key: ["member", "role"]) {
  member: CompanyMember!
  role: CompanyRole!
}

# Overrides are explicit and cannot grant database access by themselves.
# The connector still checks roles, tenant and record ownership.
type MemberViewOverride @table(key: ["member", "view"]) {
  member: CompanyMember!
  view: PortalView!
  enabled: Boolean!
}

type StaffInvitation @table @unique(fields: ["company", "email"]) {
  company: Company!
  email: String!
  requestedDepartment: Department
  invitedBy: AppUser!
  status: String! @default(value: "INVITED")
  expiresAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

type StaffApplication @table @unique(fields: ["company", "firebaseUid"]) {
  company: Company!
  firebaseUid: String!
  email: String!
  displayName: String!
  phone: String!
  requestedDepartment: Department
  photoStoragePath: String
  identityStoragePath: String
  status: String! @default(value: "PENDING")
  submittedAt: Timestamp! @default(expr: "request.time")
  reviewedAt: Timestamp
  reviewedBy: AppUser
  reviewNotes: String
}

type Insurer @table @unique(fields: ["company", "name"]) {
  company: Company!
  name: String!
  active: Boolean! @default(value: true)
}

type Customer @table {
  company: Company!
  fullName: String!
  email: String
  phone: String
  city: String
  customerType: String! @default(value: "PERSON")
  active: Boolean! @default(value: true)
  owner: CompanyMember
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
}

type SalesOpportunity @table {
  company: Company!
  customer: Customer!
  assignedTo: CompanyMember!
  product: String!
  estimatedPremiumCents: Int64!
  currency: String! @default(value: "USD")
  source: String!
  stage: String! @default(value: "NEW")
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type InsuranceQuote @table {
  company: Company!
  opportunity: SalesOpportunity!
  insurer: Insurer!
  proposedPremiumCents: Int64!
  currency: String! @default(value: "USD")
  status: String! @default(value: "DRAFT")
  notes: String
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
}

type InsurancePolicy @table @unique(fields: ["company", "insurer", "policyNumber"]) {
  company: Company!
  customer: Customer!
  insurer: Insurer!
  opportunity: SalesOpportunity
  agent: CompanyMember!
  issuanceRequest: IssuanceRequest @unique
  policyNumber: String!
  product: String!
  premiumCents: Int64!
  currency: String! @default(value: "USD")
  startDate: Date!
  endDate: Date!
  status: String! @default(value: "IN_PROCESS")
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Commission @table {
  company: Company!
  policy: InsurancePolicy!
  agent: CompanyMember!
  baseCents: Int64!
  rateBasisPoints: Int!
  amountCents: Int64!
  currency: String! @default(value: "USD")
  status: String! @default(value: "PENDING")
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
}

type ServiceCase @table {
  company: Company!
  customer: Customer!
  policy: InsurancePolicy
  assignedTo: CompanyMember
  subject: String!
  description: String!
  caseType: String! @default(value: "GENERAL")
  status: String! @default(value: "OPEN")
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ManagedDocument @table {
  company: Company!
  customer: Customer
  policy: InsurancePolicy
  serviceCase: ServiceCase
  uploadedBy: AppUser!
  storagePath: String! @unique
  originalFileName: String!
  mimeType: String!
  sizeBytes: Int64!
  documentType: String!
  supersedes: ManagedDocument
  checksumSha256: String
  customerVisible: Boolean! @default(value: false)
  versionNumber: Int! @default(value: 1)
  status: String! @default(value: "ACTIVE")
  uploadedAt: Timestamp! @default(expr: "request.time")
}

type ActivityEntry @table {
  company: Company!
  actor: AppUser!
  entityType: String!
  entityId: String!
  action: String!
  detail: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# Future Namecheap integration; never store SMTP/IMAP passwords in these rows.
type Mailbox @table @unique(fields: ["company", "address"]) {
  company: Company!
  address: String!
  department: Department
  responsible: CompanyMember
  provider: String! @default(value: "NAMECHEAP")
  secretReference: String
  active: Boolean! @default(value: false)
}

type MailThread @table {
  company: Company!
  mailbox: Mailbox!
  customer: Customer
  assignedTo: CompanyMember
  externalThreadKey: String
  subject: String!
  status: String! @default(value: "OPEN")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type MailEvent @table {
  company: Company!
  thread: MailThread!
  externalMessageKey: String!
  direction: String!
  fromAddress: String!
  toAddress: String!
  subject: String!
  sentAt: Timestamp
  receivedAt: Timestamp! @default(expr: "request.time")
}

type OutboundNotification @table {
  company: Company!
  recipientEmail: String!
  recipient: AppUser
  kind: String!
  relatedEntityId: String
  status: String! @default(value: "QUEUED")
  createdAt: Timestamp! @default(expr: "request.time")
  deliveredAt: Timestamp
}


# Enterprise operations v2. Proposed schema; validate migrations in SQL Connect emulator.
# All relationships must be checked against the company and the customer's assigned
# owner in trusted transactional code; foreign keys alone are NOT authorization.

# Explicit linkage, independent of staff membership. A verified Google email is
# only used for an approved initial claim. Never grant access on email match alone.
type CustomerPortalAccess @table @unique(fields: ["company", "customer", "user"]) {
  company: Company!
  customer: Customer!
  user: AppUser!
  approvedEmail: String!
  active: Boolean! @default(value: false)
  approvedBy: AppUser!
  approvedAt: Timestamp! @default(expr: "request.time")
  revokedAt: Timestamp
}

type InsuredVehicle @table {
  company: Company!
  customer: Customer!
  plate: String
  vin: String
  make: String
  model: String
  modelYear: Int
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Document requirements are configurable by insurer and product; no real
# identity numbers are needed in this metadata.
type IssuanceDocumentRequirement @table @unique(fields: ["company", "insurer", "productKey", "documentKind"]) {
  company: Company!
  insurer: Insurer!
  productKey: String!
  documentKind: String!
  label: String!
  required: Boolean! @default(value: true)
  active: Boolean! @default(value: true)
}

type IssuanceRequest @table {
  company: Company!
  customer: Customer!
  insurer: Insurer!
  agent: CompanyMember!
  vehicle: InsuredVehicle
  assignedOperator: CompanyMember
  productKey: String!
  status: String! @default(value: "DRAFT")
  notes: String
  correctionReason: String
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
  submittedAt: Timestamp
  completedAt: Timestamp
  updatedAt: Timestamp! @default(expr: "request.time")
  revision: Int! @default(value: 0)
}

# One current version per request/type; earlier immutable ManagedDocument
# versions remain linked through supersedes. Policy PDFs use ISSUED_POLICY_PDF.
type IssuanceAttachment @table @unique(fields: ["request", "documentKind"]) {
  company: Company!
  request: IssuanceRequest!
  document: ManagedDocument!
  documentKind: String!
  attachedBy: AppUser!
  attachedAt: Timestamp! @default(expr: "request.time")
}

type IssuanceStatusEvent @table @unique(fields: ["request", "revision"]) {
  company: Company!
  request: IssuanceRequest!
  revision: Int!
  fromStatus: String!
  toStatus: String!
  actor: AppUser!
  note: String
  occurredAt: Timestamp! @default(expr: "request.time")
}

# Notifications are per recipient. Create from trusted transaction/outbox
# only, not from arbitrary client-controlled recipient parameters.
type InboxNotification @table @unique(fields: ["company", "recipient", "deduplicationKey"]) {
  company: Company!
  recipient: AppUser!
  issuanceRequest: IssuanceRequest
  kind: String!
  deduplicationKey: String!
  createdAt: Timestamp! @default(expr: "request.time")
  readAt: Timestamp
}

# Versioned rules: dates, basis and rates await ACOS confirmation.
# No arbitrary defaults or guessed commissions are used.
type InsurerCutRule @table @unique(fields: ["company", "insurer", "version"]) {
  company: Company!
  insurer: Insurer!
  version: Int!
  effectiveFrom: Date!
  effectiveTo: Date
  cutoffDay: Int
  calculationBasis: String!
  currency: String!
  active: Boolean! @default(value: false)
  createdBy: AppUser!
}

type CommissionPeriod @table @unique(fields: ["company", "insurer", "startsOn", "endsOn", "currency"]) {
  company: Company!
  insurer: Insurer!
  rule: InsurerCutRule!
  startsOn: Date!
  endsOn: Date!
  currency: String!
  status: String! @default(value: "OPEN")
  closedAt: Timestamp
  closedBy: AppUser
}

type CommissionPeriodItem @table @unique(fields: ["commission"]) {
  company: Company!
  period: CommissionPeriod!
  commission: Commission!
  approvedCents: Int64!
  createdBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
}

type CommissionPayment @table @unique(fields: ["company", "idempotencyKey"]) {
  company: Company!
  agent: CompanyMember!
  currency: String!
  paidCents: Int64!
  reference: String!
  idempotencyKey: String!
  paidOn: Date!
  recordedBy: AppUser!
  createdAt: Timestamp! @default(expr: "request.time")
}

type CommissionPaymentAllocation @table(key: ["payment", "item"]) {
  company: Company!
  payment: CommissionPayment!
  item: CommissionPeriodItem!
  allocatedCents: Int64!
}

# Corporate-only mail. External IDs are scoped to mailbox, and content
# is not collected until the connector has organizational authorization.
type CorporateMailAudit @table @unique(fields: ["mailbox", "providerMessageId"]) {
  company: Company!
  mailbox: Mailbox!
  actor: CompanyMember
  customer: Customer
  issuanceRequest: IssuanceRequest
  providerMessageId: String!
  direction: String!
  recipientAddress: String!
  subject: String
  eventAt: Timestamp!
  recordedAt: Timestamp! @default(expr: "request.time")
}
